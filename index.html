<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cennik Konwersji" />
    <meta name="application-name" content="Cennik Konwersji" />
    <meta name="description" content="Cennik i katalog konwersji lamp samochodowych oraz adaptacji systemów multimedialnych USA/Europa." />
    <meta property="og:title" content="Cennik konwersji lamp i multimediów" />
    <meta property="og:description" content="Cennik i katalog konwersji lamp samochodowych oraz adaptacji systemów multimedialnych USA/Europa." />
    <title>Cennik konwersji lamp i multimediów</title>
    <style>
      html, body {
        background-color: #020617;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-white">
    <div id="root">
      <!-- Pure mechanical spinning gear loader with uniform navy background -->
      <div id="pre-loader-screen" style="min-height: 100vh; background-color: #020617; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 20px; box-sizing: border-box; text-align: center;">
        <div style="max-width: 300px; width: 100%; background: transparent; border: none; padding: 0; box-sizing: border-box; text-align: center;">
          
          <!-- Elegant Spinning Gear SVG -->
          <div style="width: 64px; height: 64px; margin: 0 auto 16px auto; position: relative; display: flex; align-items: center; justify-content: center;">
            <svg style="width: 56px; height: 56px; color: #fbbf24; animation: spinGear 5s linear infinite; transform-origin: 50% 50%; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="30" stroke="#fbbf24" stroke-width="4" fill="none" />
              <circle cx="50" cy="50" r="14" stroke="#fbbf24" stroke-width="3" stroke-dasharray="3 3" />
              <circle cx="50" cy="50" r="5" fill="#fbbf24" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(30 50 50)" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(60 50 50)" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(90 50 50)" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(120 50 50)" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(150 50 50)" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(180 50 50)" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(210 50 50)" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(240 50 50)" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(270 50 50)" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(300 50 50)" />
              <rect x="46" y="12" width="8" height="12" rx="2" fill="#fbbf24" transform="rotate(330 50 50)" />
            </svg>
          </div>

          <!-- Status & Percentage Info -->
          <div style="font-size: 15px; font-weight: 600; color: #ffffff; margin-bottom: 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">
            Wczytywanie...
          </div>

          <!-- Delicate Slim Progress Bar -->
          <div style="width: 180px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 999px; overflow: hidden; position: relative; margin: 0 auto;">
            <div style="width: 100%; height: 100%; background: #fbbf24; border-radius: 999px; animation: progressSweep 1.8s ease-in-out infinite;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes spinGear {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes progressSweep {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(0%); }
          100% { transform: translateX(100%); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
