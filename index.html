<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="alternate icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cennik konwersji lamp i multimediów" />
    <meta name="description" content="Cennik i katalog konwersji lamp samochodowych oraz adaptacji systemów multimedialnych USA/Europa." />
    <meta property="og:title" content="Cennik konwersji lamp i multimediów" />
    <meta property="og:description" content="Cennik i katalog konwersji lamp samochodowych oraz adaptacji systemów multimedialnych USA/Europa." />
    <title>Cennik konwersji lamp i multimediów</title>
    <style>
      html, body {
        background-color: #020617;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-white">
    <div id="root">
      <!-- Clean, graceful CSS fallback loader while React initializes -->
      <div id="pre-loader-screen" style="min-height: 100vh; background-color: #020617; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 20px; box-sizing: border-box; text-align: center;">
        <div style="max-width: 420px; width: 100%; background: #0f172a; border: 1px solid #1e293b; border-radius: 24px; padding: 32px 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); box-sizing: border-box;">
          
          <div style="width: 52px; height: 52px; border-radius: 16px; background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.3); display: flex; align-items: center; justify-content: center; color: #fbbf24; font-size: 24px; margin: 0 auto 18px auto;">
            ⚡
          </div>

          <div style="font-size: 17px; font-weight: bold; color: #f8fafc; line-height: 1.2; margin-bottom: 6px;">
            Cennik konwersji lamp i multimediów
          </div>
          <div style="font-size: 12px; color: #94a3b8; margin-bottom: 24px;">
            Inicjalizacja aplikacji i bazy 461 modeli...
          </div>

          <!-- Pulsing loading bar -->
          <div style="width: 100%; height: 8px; background: #1e293b; border-radius: 999px; overflow: hidden; position: relative; margin-bottom: 16px;">
            <div style="width: 100%; height: 100%; background: linear-gradient(90deg, #f59e0b, #fbbf24, #fef08a); border-radius: 999px; animation: pulseGlow 1.5s ease-in-out infinite;"></div>
          </div>

          <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 11px; color: #34d399; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 999px; padding: 6px 14px;">
            <span style="width: 6px; height: 6px; background: #34d399; border-radius: 50%; display: inline-block;"></span>
            <span>Uruchamianie cennika...</span>
          </div>
        </div>
      </div>
      <style>
        @keyframes pulseGlow {
          0%, 100% { opacity: 0.6; transform: scaleX(0.7); }
          50% { opacity: 1; transform: scaleX(1); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
